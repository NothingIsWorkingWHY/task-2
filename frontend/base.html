<!-- base html template for the frontend of the ToKa Fitness website -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- block for title of page-->
    <title>{% block title %}{% endblock %}</title>
    <!-- link to tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg=#ffffff">
    <header class="bg=#04FF00">
        <h1 class="text-3xl font-bold text-center py-4">ToKa Fitness {% block header %}{% endblock %}</h1>
    </header>
    <!-- navigation bar for the website with links to other pages -->
    <nav class="w-full bg-white shadow-md px-8 py-4"> 
        <div class="max-w-7xl mx-auto flex items-center justify-between"> 
            <div class="flex items-center space-x-8"> 
                <a href="/" class="text-gray-700 hover:text-blue-600 font-medium transition">Home</a> 
                <a href="/guides" class="text-gray-700 hover:text-blue-600 font-medium transition">Guides</a> 
                <a href="/custom-plans" class="text-gray-700 hover:text-blue-600 font-medium transition">Custom Plans</a> 
                <a href="/membership" class="text-gray-700 hover:text-blue-600 font-medium transition">Purchase Membership</a> 
            </div> 
            <div class="flex items-center space-x-4"> 
                <a href="/login" class="text-gray-700 hover:text-blue-600 font-medium transition"> Login</a> 
                <a href="/signup" class="bg-blue-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-blue-700 transition"> Sign Up</a> 
            </div> 
        </div> 
    </nav> 
<!-- main content section of the website -->
    <section class="container mx-auto py-8">
        {% block content %}{% endblock %}
    </section>
</body>
</html>
