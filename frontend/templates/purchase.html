{% extends "base.html" %}

{% block title %}Plans{% endblock %}

{% block header %}Plans{% endblock %}
<!-- This is the purchase form where users can enter their card information to make a purchase -->
{% block content %}
    <div class="container mx-auto px-4 py-8 rounded-lg shadow-md bg-white">
        <h1>Welcome to the purchase page where i steal your money :p </h1>
    </div>
    
    <form action="/purchase" method="POST"> 
    <label for="cardnumber">Card Number:</label> 
    <input type="number" id="cardnumber" name="cardnumber" required> 
 
    <br><br> 
 
    <label for="securitycode">Password:</label> 
    <input type="number" id="securitycode" name="securitycode" required> 
 
    <br><br> 
 
    <button type="submit">Submit</button> 
    </form> 
{% endblock %}
