{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block header %}Login{% endblock %}
<!-- v1 This is the login form where users can enter their credentials to log in -->
{% block content %}
    <form action="/login" method="POST"> 
        <label for="username">Username:</label> 
        <input type="text" id="username" name="username" required class="border-black"> 
 
        <br><br> 
 
        <label for="password">Password:</label> 
        <input type="password" id="password" name="password" required class="border-black"> 
 
        <br><br> 
 
        <button type="submit">Submit</button> 
    </form> 
{% endblock %}
